# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >
  Be direct and technical. No pleasantries. Focus on correctness, concurrency
  safety, and architectural boundaries. Challenge code — disagreement backed
  by reasoning is expected. Flag silent error paths.
early_access: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  poem: false
  changed_files_summary: true
  labeling_instructions: []
  path_filters: []
  path_instructions:
    - path: "engine/**"
      instructions: >
        This is the hexagonal architecture engine layer. It must have ZERO
        UI framework imports (no bubbletea, no lipgloss). Dependencies point
        inward only: buffer ← editor ← session, llm.Provider ← agent ← session.
        Flag any import from tui/ or any UI framework.

        Key contracts to verify:
        - Every error must be explicitly handled (no _ = fn() without comment)
        - Buffer operations must be grouped for undo (BeginGroup/EndGroup)
        - Channel operations must not block indefinitely — check for ctx.Done()
        - The agent.Workspace interface is called from the agent goroutine;
          implementations must not touch shared TUI state without synchronization

    - path: "engine/agent/**"
      instructions: >
        Agent loop runs in a goroutine. Tool implementations receive dependencies
        via constructor injection (Workspace, FileCache, channels).
        Check for:
        - Data races: FileCache has its own mutex, but tools must not access
          session/editor state directly
        - Channel deadlocks: approveCh and continueCh are buffered(1), sends
          use select/default to avoid blocking
        - Silent retry state (EditFileTool) must be reset between runs
        - Tool results must not include sensitive information

    - path: "engine/session/**"
      instructions: >
        Session orchestrates the developer-agent collaboration workflow.
        Key invariants:
        - Edit approval is two-step: ReviewEdit (marks reviewed) then
          ApproveEdit/PrepareApproval (fails if not reviewed). No blind approvals.
        - All editor map keys must go through canonPath() for consistency
        - resolvePath() must reject paths escaping projectRoot
        - SwitchTo() must NOT cancel the agent (multi-file work continues)
        - Continue() must send lastEditedFile content, not activeFile
        - editorForEdit() auto-opens files from disk if not in editors map

    - path: "engine/llm/**"
      instructions: >
        LLM provider abstraction. Provider is an interface (inbound port).
        AgentAPI is the adapter (OpenAI-compatible HTTP + SSE).
        - ToolDef types are exported — used by agent/tool implementations
        - Stream() takes tools parameter — tools are not hardcoded
        - SSE parsing handles both "data: " and "data:" formats

    - path: "tui/**"
      instructions: >
        Bubble Tea frontend — thin adapter around the engine. Prism-style
        pane architecture (each pane implements Update/Render/SetSize).

        Check for:
        - Engine logic leaking into TUI (business logic belongs in session/agent)
        - RegionManager handles layout — panes should not calculate their own
          global positions
        - AppModel is a thin adapter: maps input → session methods, reads
          session state to render, adapts agent events to tea.Msg
        - File switching must be blocked while PendingEdit != nil
        - EditorModel must be rebuilt when session auto-switches files

    - path: "tui/cmd/junto/main.go"
      instructions: >
        Entry point wiring. Bootstrap order matters:
        1. Create editor + buffer
        2. Determine project root
        3. Create session (editor-only mode)
        4. Create agent with session as Workspace
        5. Wire agent into session via SetAgent()
        Session must exist before agent (breaks circular dependency).

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
