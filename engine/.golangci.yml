version: "2"

linters:
  enable:
    - depguard
    - cyclop
    - funlen
    - gocognit
    - interfacebloat

  settings:
    # --- SOLID: Single Responsibility proxies ---

    # Functions that are too long likely do too much (SRP).
    funlen:
      lines: 80
      statements: 50

    # High cyclomatic complexity = too many branches = likely multiple responsibilities.
    cyclop:
      max-complexity: 15

    # Cognitive complexity measures how hard a function is to understand.
    gocognit:
      min-complexity: 30

    # --- SOLID: Interface Segregation ---

    # Fat interfaces violate ISP. Keep interfaces small and focused.
    interfacebloat:
      max: 6

    # --- SOLID: Dependency Inversion (hexagonal boundaries) ---

    depguard:
      rules:
        # buffer is the lowest layer — stdlib only, no engine imports.
        buffer-isolation:
          files:
            - "**/buffer/*.go"
          deny:
            - pkg: "github.com/latebit-io/nib/engine/editor"
              desc: "buffer must not import editor (dependency inversion)"
            - pkg: "github.com/latebit-io/nib/ai/llm"
              desc: "buffer must not import llm (dependency inversion)"
            - pkg: "github.com/latebit-io/nib/engine/highlight"
              desc: "buffer must not import highlight"
            - pkg: "github.com/latebit-io/nib/engine/filelist"
              desc: "buffer must not import filelist"
            - pkg: "github.com/latebit-io/nib/engine/fuzzy"
              desc: "buffer must not import fuzzy"
            - pkg: "github.com/latebit-io/nib/tui"
              desc: "engine must never import tui"

        # editor depends on buffer only. Highlighting is provided via the
        # editor.Highlighter interface so binaries that never render (e.g.
        # the headless agent) doesn't pull in tree-sitter grammar blobs transitively.
        editor-isolation:
          files:
            - "**/editor/*.go"
          deny:
            - pkg: "github.com/latebit-io/nib/ai/llm"
              desc: "editor must not import llm"
            - pkg: "github.com/latebit-io/nib/engine/highlight"
              desc: "editor must not import highlight — highlighting is injected via the Highlighter interface so the headless agent stays grammar-free"
            - pkg: "github.com/latebit-io/nib/engine/filelist"
              desc: "editor must not import filelist"
            - pkg: "github.com/latebit-io/nib/engine/fuzzy"
              desc: "editor must not import fuzzy"
            - pkg: "github.com/latebit-io/nib/tui"
              desc: "engine must never import tui"

        # No engine package may import tui — dependencies point inward only.
        engine-no-tui:
          deny:
            - pkg: "github.com/latebit-io/nib/tui"
              desc: "engine must never import tui — dependencies point inward only"
