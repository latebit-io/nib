version: "2"

linters:
  enable:
    - depguard
    - cyclop
    - funlen
    - gocognit
    - interfacebloat

  settings:
    # --- SOLID: Single Responsibility proxies ---

    # Functions that are too long likely do too much (SRP).
    funlen:
      lines: 80
      statements: 50

    # High cyclomatic complexity = too many branches = likely multiple responsibilities.
    cyclop:
      max-complexity: 15

    # Cognitive complexity measures how hard a function is to understand.
    gocognit:
      min-complexity: 30

    # --- SOLID: Interface Segregation ---

    # Fat interfaces violate ISP. Keep interfaces small and focused.
    interfacebloat:
      max: 6

    # --- SOLID: Dependency Inversion (hexagonal boundaries) ---
    #
    # engine is a zero-nib-dependency library of shared editor primitives.
    # It imports nothing from ai/agent/kit/coding/tui/cmd; the module's
    # go.mod carries no nib requires. depguard `files` globs match against
    # absolute paths, so every file-scoped rule is anchored with
    # `**/engine/...`.
    depguard:
      rules:
        # Whole-module backstop: engine reaches into no other nib module.
        engine-standalone:
          deny:
            - pkg: "github.com/latebit-io/nib/ai"
              desc: "engine must not import ai — engine is a standalone editor library"
            - pkg: "github.com/latebit-io/nib/agent"
              desc: "engine must not import agent — agent composes engine, not the reverse"
            - pkg: "github.com/latebit-io/nib/kit"
              desc: "engine must not import kit — kit consumers wire engine adapters on their side"
            - pkg: "github.com/latebit-io/nib/coding"
              desc: "engine must never import coding — engine is editor + shared infra; application logic lives in coding"
            - pkg: "github.com/latebit-io/nib/tui"
              desc: "engine must never import tui — dependencies point inward only"
            - pkg: "github.com/latebit-io/nib/cmd"
              desc: "engine must not import composition roots"
            - pkg: "github.com/stretchr/testify"
              desc: "stdlib testing only — no testify"

        # Headless-safe leaves and pure ports: stdlib only. Headless
        # binaries link buffer/openfile/syntax freely; nothing here may
        # grow a third-party or engine-adapter dependency.
        headless-safe-leaves:
          list-mode: strict
          files:
            - "**/engine/buffer/*.go"
            - "**/engine/syntax/*.go"
            - "**/engine/event/*.go"
            - "**/engine/lang/*.go"
          allow:
            - $gostd

        # openfile is the buffer-only file handle (buffer + edit-domain
        # ops). It may import buffer and nothing else nib-side — that is
        # what keeps headless binaries free of cursor/highlighter machinery.
        openfile-isolation:
          list-mode: strict
          files:
            - "**/engine/openfile/*.go"
          allow:
            - $gostd
            - "github.com/latebit-io/nib/engine/buffer"

        # Test scaffolding never links into production code.
        contracttest-tests-only:
          files:
            - "!$test"
          deny:
            - pkg: "github.com/latebit-io/nib/engine/contracttest"
              desc: "contracttest is test-only; production code must not import it"
