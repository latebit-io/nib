version: "2"

linters:
  enable:
    - depguard

  settings:
    # --- Layering: tui must never import application code ---
    depguard:
      rules:
        # tui/editor is the TUI's editor controller. It depends on
        # buffer + syntax (the abstract highlighter interface) only —
        # never on the concrete tree-sitter highlight package, never on
        # llm, file-walking, or fuzzy-matching utilities. The editor
        # used to live under engine/ and these rules guarded it there;
        # they ride along now that the package moved to tui/editor.
        editor-isolation:
          files:
            - "**/editor/*.go"
            - "editor/*.go"
          deny:
            - pkg: "github.com/latebit-io/nib/ai/llm"
              desc: "editor must not import llm"
            - pkg: "github.com/latebit-io/nib/engine/highlight"
              desc: "editor must not import the concrete highlight package — highlighting is injected via the syntax.Highlighter interface so the dependency stays open to substitution"
            - pkg: "github.com/latebit-io/nib/engine/filelist"
              desc: "editor must not import filelist"
            - pkg: "github.com/latebit-io/nib/engine/fuzzy"
              desc: "editor must not import fuzzy"
            - pkg: "github.com/latebit-io/nib/engine/openfile"
              desc: "editor must not import openfile — the editor wraps a *buffer.Buffer directly; openfile is the session-side handle and pulling it in would couple frontend rendering to the workspace surface"
            - pkg: "github.com/latebit-io/nib/coding"
              desc: "editor must not import coding — application logic flows through AppModel, not the controller"
            - pkg: "github.com/latebit-io/nib/tui/ui"
              desc: "editor must not import tui/ui — the controller is consumed by ui, not the reverse"

        # tui/ui (the inner UI packages) must not reach into application
        # composition. The umbrella facade tui/tui.go is intentionally
        # exempted: it takes *agent.Agent in its Config so external
        # callers can wire a concrete agent into the app — that's the
        # composition seam, not a layering violation.
        tui-ui-no-composition:
          files:
            - "**/ui/*.go"
            - "**/ui/textarea/*.go"
            - "**/editor/*.go"
          deny:
            - pkg: "github.com/latebit-io/nib/coding/agent"
              desc: "tui/ui must not import coding/agent directly — agent is consumed via session/event abstractions; concrete agent flows in via the facade"
            - pkg: "github.com/latebit-io/nib/coding/wire"
              desc: "tui/ui must not import coding/wire — wire is a composition root, not a dependency"
            - pkg: "github.com/latebit-io/nib/coding/headless"
              desc: "tui/ui must not import coding/headless — headless is a separate frontend"
